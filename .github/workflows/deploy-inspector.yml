name: Verify and publish build inspector
on:
  push:
    branches: [main]
    paths:
      - 'inspector/**'
      - 'scripts/inspector/**'
      - 'provenance/browser-inspector-verification.json'
      - '.github/workflows/deploy-inspector.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scci_rh-build-inspector-pages
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check exact published source and inspection derivatives
        run: |
          python scripts/verify_manifest.py
          python scripts/inspector/verify_inspector.py
          python scripts/inspector/build_electronics_assets.py --verify
          node scripts/inspector/check_three_loader.mjs

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: inspector
      - uses: actions/deploy-pages@v4
        id: deployment
